sonar.projectKey=Zhou-chu_Claude-Cage
sonar.organization=zhou-chu
sonar.projectName=Claude-Cage

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.language=go

# 测试与覆盖率
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# 排除：构建产物、第三方嵌入资源、前端打包产物、生成文件
sonar.exclusions=\
  _output/**,\
  dist/**,\
  node_modules/**,\
  **/node_modules/**,\
  desktop/**/obj/**,\
  desktop/**/bin/**,\
  third_party/**,\
  vendor/**,\
  internal/workbench/web/**,\
  internal/tailnetassets/assets/**,\
  internal/guestos/assets/**,\
  **/*.min.js,\
  **/*.pb.go,\
  **/*_generated.go

# 重复代码检测排除前端打包产物
sonar.cpd.exclusions=\
  internal/workbench/web/**,\
  **/*_test.go